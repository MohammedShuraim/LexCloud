AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LexCloud storage — private PDF uploads and extracted document text

Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "lexcloud-uploads-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
              - POST
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
              - x-amz-request-id
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfterThirtyDays
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 30

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LexCloudDocuments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_name
          AttributeType: S
      KeySchema:
        - AttributeName: document_name
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

Outputs:
  UploadsBucketName:
    Description: S3 bucket for presigned PDF uploads
    Value: !Ref UploadsBucket
  DocumentsTableName:
    Description: DynamoDB table holding Textract output
    Value: !Ref DocumentsTable
