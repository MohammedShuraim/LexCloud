AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LexCloud serverless legal advisor

Parameters:
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: changeme
    Description: Groq API key for Llama chat/RAG and Whisper transcription

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "lexcloud-uploads-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
              - POST
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
              - x-amz-request-id
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfterThirtyDays
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 30

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LexCloudDocuments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_name
          AttributeType: S
      KeySchema:
        - AttributeName: document_name
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  LexCloudApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: LexCloudApi
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"
        MaxAge: "'300'"

  UploaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LexCloudUploader
      Handler: app.lambda_handler
      CodeUri: lambdas/uploader/
      Description: Issue S3 presigned PUT URLs for PDF uploads
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadsBucket
      Environment:
        Variables:
          DOCUMENT_BUCKET: !Ref UploadsBucket
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref LexCloudApi
            Path: /upload
            Method: POST

Outputs:
  UploadsBucketName:
    Description: S3 bucket for presigned PDF uploads
    Value: !Ref UploadsBucket
  DocumentsTableName:
    Description: DynamoDB table holding Textract output
    Value: !Ref DocumentsTable
  ApiBaseUrl:
    Description: API Gateway base URL for the LexCloud frontend
    Value: !Sub "https://${LexCloudApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
