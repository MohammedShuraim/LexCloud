AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LexCloud serverless legal advisor

Parameters:
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: changeme
    Description: Groq API key for Llama chat/RAG and Whisper transcription

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64

Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "lexcloud-uploads-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
              - GET
              - HEAD
              - POST
            AllowedOrigins:
              - "*"
            ExposedHeaders:
              - ETag
              - x-amz-request-id
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfterThirtyDays
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 30

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: LexCloudDocuments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: document_name
          AttributeType: S
      KeySchema:
        - AttributeName: document_name
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  LexCloudApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: LexCloudApi
      StageName: prod
      BinaryMediaTypes:
        - multipart~1form-data
        - audio~1webm
        - audio~1wav
        - audio~1mpeg
        - application~1octet-stream
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"
        MaxAge: "'300'"

  UploaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LexCloudUploader
      Handler: app.lambda_handler
      CodeUri: lambdas/uploader/
      Description: Issue S3 presigned PUT URLs for PDF uploads
      Policies:
        - S3WritePolicy:
            BucketName: !Ref UploadsBucket
      Environment:
        Variables:
          DOCUMENT_BUCKET: !Ref UploadsBucket
      Events:
        UploadApi:
          Type: Api
          Properties:
            RestApiId: !Ref LexCloudApi
            Path: /upload
            Method: POST

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LexCloudProcessor
      Handler: app.lambda_handler
      CodeUri: lambdas/processor/
      Timeout: 300
      MemorySize: 512
      Description: Textract PDFs on S3 upload and store text in DynamoDB
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DocumentsTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::lexcloud-uploads-${AWS::AccountId}/*"
            - Effect: Allow
              Action:
                - textract:StartDocumentTextDetection
                - textract:GetDocumentTextDetection
              Resource: "*"
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DocumentsTable
      Events:
        PdfCreated:
          Type: S3
          Properties:
            Bucket: !Ref UploadsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LexCloudStatus
      Handler: app.lambda_handler
      CodeUri: lambdas/status/
      Description: Poll whether Textract has stored document text
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DocumentsTable
      Events:
        StatusApi:
          Type: Api
          Properties:
            RestApiId: !Ref LexCloudApi
            Path: /document
            Method: GET

  AiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LexCloudAi
      Handler: app.lambda_handler
      CodeUri: lambdas/ai/
      Timeout: 60
      MemorySize: 512
      Description: RAG, general legal chat, and Amazon Translate
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DocumentsTable
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
              Resource: "*"
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DocumentsTable
          GROQ_API_KEY: !Ref GroqApiKey
      Events:
        QueryApi:
          Type: Api
          Properties:
            RestApiId: !Ref LexCloudApi
            Path: /query
            Method: POST

  TtsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LexCloudTts
      Handler: app.lambda_handler
      CodeUri: lambdas/tts/
      Timeout: 30
      Description: Amazon Polly Aditi speech synthesis
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: "*"
      Events:
        TtsApi:
          Type: Api
          Properties:
            RestApiId: !Ref LexCloudApi
            Path: /tts
            Method: POST

  TranscriberFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: LexCloudTranscriber
      Handler: app.lambda_handler
      CodeUri: lambdas/transcriber/
      Timeout: 60
      MemorySize: 512
      Description: Groq Whisper speech-to-text
      Environment:
        Variables:
          GROQ_API_KEY: !Ref GroqApiKey
      Events:
        TranscribeApi:
          Type: Api
          Properties:
            RestApiId: !Ref LexCloudApi
            Path: /transcribe
            Method: POST

Outputs:
  UploadsBucketName:
    Description: S3 bucket for presigned PDF uploads
    Value: !Ref UploadsBucket
  DocumentsTableName:
    Description: DynamoDB table holding Textract output
    Value: !Ref DocumentsTable
  ApiBaseUrl:
    Description: API Gateway base URL for the LexCloud frontend
    Value: !Sub "https://${LexCloudApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
